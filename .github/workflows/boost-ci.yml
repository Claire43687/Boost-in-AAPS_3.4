name: Boost CI

# Builds Boost and signs it with your own key. Android installs it over an existing AAPS or Boost
# only when the key matches, so use the KEYSTORE secrets your current build was signed with.
on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select Boost release'
        required: true
        default: '4.0.0-boost-6.3.0'
        type: choice
        options:
          - 4.0.0-boost-6.3.0
          - 4.0.0-boost-6.3.0.E
          - 4.0.0-boost-6.2.0

env:
  BOOST_REPO: tim2000s/Boost
  BUILD_VARIANT: fullRelease

permissions:
  contents: read

jobs:
  build:
    name: Build Boost
    runs-on: ubuntu-latest
    steps:
      - name: Decode Secrets Keystore Set and Oauth2 to Env
        env:
          # Secrets arrive as environment variables. They must not be pasted into
          # the script text, because bash then parses them as source: any $,
          # backtick, quote or newline inside a password changes or truncates the
          # value before it is ever used, and jarsigner then blames the password.
          S_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          S_GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
        run: |
          # The heredoc form of GITHUB_ENV keeps any value intact, newlines
          # included. The delimiter is random so that no value can close the
          # block early and add variables of its own.
          DELIM="AAPS_EOF_$(openssl rand -hex 16)"
          emit() { printf '%s<<%s\n%s\n%s\n' "$1" "$DELIM" "$2" "$DELIM" >> "$GITHUB_ENV"; }
          # Values cut out of KEYSTORE_SET are not registered secrets, so the
          # runner does not hide them in the log unless we ask it to.
          emit_masked() { echo "::add-mask::$2"; emit "$1" "$2"; }

          if [ -n "$S_KEYSTORE_SET" ]; then
            echo "🔐 Decoding KEYSTORE_SET..."
            DECODED=$(printf '%s' "$S_KEYSTORE_SET" | base64 -d)

            emit_masked KEYSTORE_BASE64   "$(printf '%s' "$DECODED" | cut -d'|' -f1)"
            emit_masked KEYSTORE_PASSWORD "$(printf '%s' "$DECODED" | cut -d'|' -f2)"
            emit_masked KEY_ALIAS         "$(printf '%s' "$DECODED" | cut -d'|' -f3)"
            emit_masked KEY_PASSWORD      "$(printf '%s' "$DECODED" | cut -d'|' -f4)"

            echo "✅ Keystore parameters extracted from KEYSTORE_SET"
          else
            echo "ℹ️ KEYSTORE_SET not provided, using separate secrets."
            emit KEYSTORE_BASE64   "$S_KEYSTORE_BASE64"
            emit KEYSTORE_PASSWORD "$S_KEYSTORE_PASSWORD"
            emit KEY_ALIAS         "$S_KEY_ALIAS"
            emit KEY_PASSWORD      "$S_KEY_PASSWORD"
          fi
          emit GDRIVE_OAUTH2 "$S_GDRIVE_OAUTH2"

      - name: Check Secrets
        run: |
          echo "🔍 Checking required secrets..."
          MISSING=0

          check_secret() {
            if [ -z "$1" ]; then
              echo "❌ Missing secret: $2"
              MISSING=1
            fi
          }

          # Check secrets
          check_secret "$GDRIVE_OAUTH2" "GDRIVE_OAUTH2"

          check_secret "$KEYSTORE_BASE64" "KEYSTORE_BASE64"
          check_secret "$KEYSTORE_PASSWORD" "KEYSTORE_PASSWORD"
          check_secret "$KEY_ALIAS" "KEY_ALIAS"
          check_secret "$KEY_PASSWORD" "KEY_PASSWORD"

          if [ "$MISSING" -eq 1 ]; then
            echo "🛑 Missing required secrets. Stopping build."
            exit 1
          fi

          echo "✅ All required secrets are present."

      - name: Decode keystore file
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Validating keystore, alias and password
        run: |
          echo "🔐 Validating keystore, alias and password"

          # Create a dummy JAR file (quick method using zip)
          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          rm dummy.txt

          # Attempt to validate using jarsigner
          JARSIGNER_LOG=$(mktemp)
          if ! jarsigner \
              -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              dummy.jar "$KEY_ALIAS" > "$JARSIGNER_LOG" 2>&1; then
            echo "❌ Either KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, or KEY_ALIAS is incorrect"
            echo "🔍 jarsigner error output:"
            cat "$JARSIGNER_LOG"
            rm -f "$JARSIGNER_LOG" dummy.jar
            exit 1
          fi
          rm -f "$JARSIGNER_LOG" dummy.jar
          echo "✅ Keystore, alias, and key password are valid."

          echo "✅ Keystore and credentials validated."

      - name: Decode GDrive OAuth2 secrets
        run: |
          # GDRIVE_OAUTH2 is already in the environment from the decode step
          # above, so nothing has to be pasted into the script text here either.
          DELIM="AAPS_EOF_$(openssl rand -hex 16)"
          emit_masked() {
            echo "::add-mask::$2"
            printf '%s<<%s\n%s\n%s\n' "$1" "$DELIM" "$2" "$DELIM" >> "$GITHUB_ENV"
          }

          echo "🔐 Decoding GDRIVE_OAUTH2..."
          DECODED=$(printf '%s' "$GDRIVE_OAUTH2" | base64 -d)

          emit_masked GDRIVE_CLIENT_ID     "$(printf '%s' "$DECODED" | cut -d'|' -f1)"
          emit_masked GDRIVE_REFRESH_TOKEN "$(printf '%s' "$DECODED" | cut -d'|' -f2)"

          echo "✅ GDRIVE_CLIENT_ID and GDRIVE_REFRESH_TOKEN extracted from GDRIVE_OAUTH2"

      - name: Checkout selected Boost release
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOOST_REPO }}
          ref: refs/tags/${{ github.event.inputs.tagName }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set VERSION
        env:
          TAG: ${{ github.event.inputs.tagName }}
        run: echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add swap on small runners
        run: |
          # A private repository gets an 8 GB runner, which the build outgrows; a public one gets 16 GB.
          if [ "$(free -m | awk '/^Mem:/{print $2}')" -lt 12000 ]; then
            # The disk with the most free space takes the swap file; the root disk has little to spare.
            DIR=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -rn | head -1 | awk '{print $2}')
            sudo fallocate -l 6G "$DIR/boost-swap" && sudo chmod 600 "$DIR/boost-swap" && sudo mkswap "$DIR/boost-swap" && sudo swapon "$DIR/boost-swap"
          fi

      - name: Build APKs
        # Kotlin compiles in-process, inside the Gradle heap. Eight workers on the 4-core runner ran out of
        # heap with "GC overhead limit exceeded" (run 42283039742, first attempt); one per core halves the
        # number of compilations held at once.
        run: |
              ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
              -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss4m" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dkotlin.compiler.execution.strategy="in-process" \
              -Dorg.gradle.daemon=true \
              -Dorg.gradle.workers.max=4 \
              -Dorg.gradle.caching=true \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APKs with version
        run: |
          mv app/build/outputs/apk/full/release/*.apk boost-${VERSION}.apk
          mv wear/build/outputs/apk/full/release/*.apk boost-wear-${VERSION}.apk

      - name: Retrieving Google Drive access token
        run: |
          echo "🔐 Getting Google OAuth2 access token..."
          TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$GDRIVE_CLIENT_ID" \
            -d refresh_token="$GDRIVE_REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)
          echo "::add-mask::$ACCESS_TOKEN"
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "❌ Failed to get access token."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "✅ Access token obtained."

      - name: Upload APKs to Google Drive
        run: |
          set -e
          echo "🔐 Start uploading APKs to Google Drive..."

          echo "📁 Checking or creating AAPS folder"
          AAPS_FOLDER_ID=$(curl -s -X GET \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files?q=name='AAPS'+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false" \
            | jq -r '.files[0].id')

          if [ "$AAPS_FOLDER_ID" == "null" ] || [ -z "$AAPS_FOLDER_ID" ]; then
            AAPS_FOLDER_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name": "AAPS", "mimeType": "application/vnd.google-apps.folder"}' \
              "https://www.googleapis.com/drive/v3/files" | jq -r '.id')
            echo "📂 Created AAPS folder: $AAPS_FOLDER_ID"
          else
            echo "📂 Found AAPS folder: $AAPS_FOLDER_ID"
          fi

          echo "📁 Checking or creating version folder: $VERSION"
          VERSION_FOLDER_ID=$(curl -s -X GET \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files?q=name='${VERSION}'+and+mimeType='application/vnd.google-apps.folder'+and+'$AAPS_FOLDER_ID'+in+parents+and+trashed=false" \
            | jq -r '.files[0].id')

          if [ "$VERSION_FOLDER_ID" == "null" ] || [ -z "$VERSION_FOLDER_ID" ]; then
            VERSION_FOLDER_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${VERSION}\", \"mimeType\": \"application/vnd.google-apps.folder\", \"parents\": [\"$AAPS_FOLDER_ID\"]}" \
              "https://www.googleapis.com/drive/v3/files" | jq -r '.id')
            echo "📂 Created version folder: $VERSION_FOLDER_ID"
          else
            echo "📂 Found version folder: $VERSION_FOLDER_ID"
          fi

          upload_to_gdrive() {
            FILE=$1
            NAME=$2
            if [ ! -f "$FILE" ]; then
              echo "❌ File not found: $FILE"
              exit 26
            fi

            echo "📄 Checking if file $NAME already exists in Google Drive..."
            QUERY="name='${NAME}' and '${VERSION_FOLDER_ID}' in parents and trashed=false"
            ENCODED_QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")
            FILE_ID=$(curl -s \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files?q=${ENCODED_QUERY}&fields=files(id)" \
              | jq -r '.files[0].id')

            if [[ -n "$FILE_ID" && "$FILE_ID" != "null" ]]; then
              echo "🗑️ Deleting existing file with ID: $FILE_ID"
              curl -s -X DELETE \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://www.googleapis.com/drive/v3/files/${FILE_ID}"
            fi

            echo "⬆️ Uploading $FILE as $NAME to Google Drive..."
            RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/gdrive_response.json \
              -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -F "metadata={\"name\":\"$NAME\", \"parents\":[\"$VERSION_FOLDER_ID\"]};type=application/json;charset=UTF-8" \
              -F "file=@$FILE;type=application/vnd.android.package-archive" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")

            HTTP_CODE="${RESPONSE: -3}"
            if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
              echo "❌ Upload failed with HTTP status: $HTTP_CODE"
              cat /tmp/gdrive_response.json
              exit 1
            fi

            echo "✅ Uploaded: $NAME"
          }

          upload_to_gdrive "boost-${VERSION}.apk" "boost-${VERSION}.apk"
          upload_to_gdrive "boost-wear-${VERSION}.apk" "boost-wear-${VERSION}.apk"

          echo "🎉 APKs successfully uploaded to Google Drive!"

